<!doctype html>

<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <label class="row">
    <input type="checkbox" id="enabled">
    <span class="grow" data-i18n="enabled"></span>
    <span class="hint" id="shortcut"></span>
  </label>
  <hr>
  <div id="site" hidden>
    <div class="host" id="host"></div>
    <div class="row">
      <span data-i18n="layoutLabel"></span>
      <select id="layout" class="grow"></select>
    </div>
    <div id="pauseBox">
      <div class="row"><button id="pause" class="grow"></button></div>
      <p class="hint" data-i18n="pauseHint"></p>
    </div>
  </div>
  <p class="hint" id="nosite" data-i18n="notASite" hidden></p>
  <p class="error" id="error" hidden></p>
  <hr>
  <div class="row"><button id="options" class="grow" data-i18n="openSettings"></button></div>
  <script src="locales.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
